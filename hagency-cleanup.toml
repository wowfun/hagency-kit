# Repository cleanup policy. These active overrides intentionally pin today's
# builtin retention defaults as the repository baseline. Other fields inherit
# builtin rules unless overridden here.
schema_version = 1

[[rules]]
id = "purge.artifacts"
auto_apply = true
preselect_after_days = 7

[[rules]]
id = "purge.cachedirs"
auto_apply = true
preselect_after_days = 7

[[rules]]
id = "clean.codex.versions"
auto_apply = true
keep_previous = 1

[[rules]]
id = "clean.claude.versions"
auto_apply = true
keep_previous = 1

[[rules]]
id = "clean.copilot.versions"
auto_apply = true
keep_previous = 1

[[rules]]
id = "clean.codex.staging"
auto_apply = true
min_age_days = 7

[[rules]]
id = "clean.project_default"
auto_apply = false
recursive = true
include_unverified = true
# Supply project roots: hgc file clean -r project_default ./ --dry-run
# Purge the entire project first; filter remaining .local files afterwards.

[rules.match]
any = [
  { ref = "purge.artifacts" },
  { ref = "purge.cachedirs" },
  { all = [
    { glob = "/.local/**" },
    { not = { any = [
      { all = [{ any = [{ is_text = true }, { is_image = true }] }, { max_file_size = "10MB" }] },
      { all = [{ is_video = true }, { max_file_size = "50MB" }] },
    ] } },
  ] },
]

# Optional examples; new rules default to explicit-only (--rule).
