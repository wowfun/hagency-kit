# Repository cleanup policy. These active overrides intentionally pin today's
# builtin retention defaults as the repository baseline. Other fields inherit
# builtin rules unless overridden here.
schema_version = 1

[[rules]]
id = "purge.artifacts"
auto_apply = true
preselect_after_days = 7

[[rules]]
id = "purge.cachedirs"
auto_apply = true
preselect_after_days = 7

[[rules]]
id = "clean.codex.versions"
auto_apply = true
keep_previous = 1

[[rules]]
id = "clean.claude.versions"
auto_apply = true
keep_previous = 1

[[rules]]
id = "clean.copilot.versions"
auto_apply = true
keep_previous = 1

[[rules]]
id = "clean.codex.staging"
auto_apply = true
min_age_days = 7

[[rules]]
id = "clean.non_text_or_large"
auto_apply = false
# Supply PATH when applying: hgc file clean ./target -r non_text_or_large --dry-run

[rules.match]
any = [{ is_text = false }, { min_file_size = 10_485_761 }]

