schema_version = 1

[[rules]]
id = "purge.artifacts"
command = "purge"
source = "project"
include = [
  ".angular/",
  ".astro/",
  ".build/",
  ".cxx/",
  ".dart_tool/",
  ".expo/",
  ".gradle/",
  ".mypy_cache/",
  ".next/",
  ".nox/",
  ".nuxt/",
  ".output/",
  ".parcel-cache/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".svelte-kit/",
  ".terragrunt-cache/",
  ".tox/",
  ".turbo/",
  ".venv/",
  ".zig-cache/",
  "DerivedData/",
  "Pods/",
  "__pycache__/",
  "bin/",
  "build/",
  "coverage/",
  "dist/",
  "node_modules/",
  "obj/",
  "target/",
  "vendor/",
  "venv/",
  "zig-out/",
]
preselect_after_days = 7

[[rules]]
id = "purge.cachedirs"
command = "purge"
source = "cachedir-tag"
include = ["**/"]
preselect_after_days = 7

[[rules]]
id = "clean.codex.versions"
command = "clean"
source = "codex.versions"
include = ["*"]
keep_previous = 1

[[rules]]
id = "clean.claude.versions"
command = "clean"
source = "claude.versions"
include = ["*"]
keep_previous = 1

[[rules]]
id = "clean.copilot.versions"
command = "clean"
source = "copilot.versions"
include = ["*"]
keep_previous = 1

[[rules]]
id = "clean.codex.staging"
command = "clean"
source = "codex.staging"
include = [".staging.*/", "openai-bundled.staging-*/", "marketplace-add-*/", "marketplace-upgrade-*/"]
min_age_days = 7
